<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Research — NEPSE Pulse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark">N</div><div><strong>NEPSE Pulse</strong><span>Company Research</span></div></div><nav><a href="index.html">Market</a><a class="active" href="company.html">Research</a></nav></header><main class="container"><section class="hero"><div><div class="eyebrow">COMPANY RESEARCH</div><h1 id="title">Research any company.</h1><p>Search a listed security and inspect its market profile, valuation and trading data.</p></div><div class="search-wrap">⌕<input id="search" placeholder="Enter symbol or company name…"></div></section><section id="results" class="card table-card"><div class="empty">Load market data to begin research.</div></section></main><footer><span>NEPSE Pulse</span><span>Informational use only — not investment advice.</span></footer><script src="script.js"></script><script>document.getElementById('search').addEventListener('input',()=>{const q=document.getElementById('search').value.trim().toLowerCase();const box=document.getElementById('results');if(!window.stocks||!q){box.innerHTML='<div class="empty">Type a symbol such as NABIL, NICA or a company name.</div>';return}const a=window.stocks.filter(s=>(s.symbol+' '+s.name).toLowerCase().includes(q)).slice(0,12);box.innerHTML=a.length?a.map(s=>`<div style="padding:18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px"><div><strong style="font-size:18px">${s.symbol}</strong><div style="color:var(--muted);margin-top:5px">${s.name}</div><div style="color:var(--muted);font-size:12px;margin-top:7px">Sector: ${s.sector||'Other'} · Volume: ${Number(s.volume||0).toLocaleString('en-IN')} · Turnover: Rs. ${Number(s.turnover||0).toLocaleString('en-IN')}</div></div><div style="text-align:right"><strong style="font-size:20px">Rs. ${Number(s.ltp||0).toFixed(2)}</strong><div class="${s.percentChange>=0?'up':'down'}" style="margin-top:5px">${s.percentChange>=0?'+':''}${Number(s.percentChange||0).toFixed(2)}%</div></div></div>`).join(''):'<div class="empty">No matching listed company found.</div>'});</script></body></html>
