<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Company Research | NEPSE Pulse</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"><style>.research-wrap{max-width:1280px;margin:auto;padding:24px 16px 60px}.company-head{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.company-head h1{margin:5px 0;font-size:clamp(24px,4vw,40px)}.quote strong{display:block;font-size:34px}.quote span{font-weight:800}.search-panel{margin-bottom:18px;position:relative}.search-panel input{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:15px;background:var(--surface)}.suggestions{position:absolute;left:0;right:0;top:52px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.12)}.suggestions button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:12px 14px;text-align:left;color:inherit;cursor:pointer}.suggestions button:hover{background:var(--surface2)}.meta-strip{margin:16px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}.metric small,.panel>small{color:var(--muted);display:block}.metric b{display:block;margin-top:6px;font-size:18px}.research-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.panel{margin-bottom:16px}.chart-box{height:360px}.indicator-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.indicator-grid>div{padding:13px;border:1px solid var(--line);border-radius:8px}.indicator-grid b{display:block;font-size:20px;margin:5px 0}.indicator-grid em{font-style:normal;color:var(--muted);font-size:12px}.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.profile-grid div{padding:10px 0;border-bottom:1px solid var(--line)}.profile-grid span{display:block;color:var(--muted);font-size:12px}.profile-grid b{display:block;margin-top:4px;overflow-wrap:anywhere}.loading,.error{padding:50px;text-align:center;color:var(--muted)}.back{display:inline-block;margin-bottom:12px;color:inherit;text-decoration:none;font-weight:800}.up{color:#087443}.down{color:#c43232}@media(max-width:900px){.company-head{display:block}.quote{text-align:left;margin-top:18px}.meta-strip{grid-template-columns:repeat(2,1fr)}.research-grid{grid-template-columns:1fr}.chart-box{height:280px}}@media(max-width:480px){.research-wrap{padding:14px 10px 40px}.company-head{padding:16px}.quote strong{font-size:29px}.metric{padding:12px}.metric b{font-size:15px}.indicator-grid,.profile-grid{grid-template-columns:1fr}.chart-box{height:230px}}</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span><span><strong>NEPSE <b>Pulse</b></strong><small>नेपाल शेयर बजार</small></span></a><nav><a href="index.html">Market</a><a class="active" href="company.html">Research</a></nav><div class="top-actions"><span id="status" class="status"><i></i> Loading</span></div></header><main class="research-wrap"><a class="back" href="index.html">← Back to NEPSE</a><div class="search-panel"><input id="companySearch" autocomplete="off" placeholder="Search company name or symbol…"><div id="suggestions" class="suggestions" hidden></div></div><div id="app" class="loading">Loading company research…</div></main></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="company-search.js"></script><script src="company-page.js"></script></body></html>
