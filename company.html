<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Company Research | NEPSE Pulse</title><link rel="stylesheet" href="style.css"><style>.research-wrap{max-width:1280px;margin:auto;padding:24px 16px 60px}.company-head{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}.company-head h1{margin:5px 0;font-size:clamp(24px,4vw,40px)}.quote strong{display:block;font-size:34px}.quote span{font-weight:800}.up{color:#087443}.down{color:#c43232}.search-panel{margin-bottom:18px;position:relative}.search-panel input{width:100%;box-sizing:border-box;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font-size:15px;background:var(--surface)}.suggestions{position:absolute;left:0;right:0;top:54px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.12)}.suggestions button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:12px 14px;text-align:left;color:inherit;cursor:pointer}.suggestions button:hover{background:var(--surface2)}.meta-strip{margin:16px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}.metric small,.panel>small{color:var(--muted);display:block}.metric b{display:block;margin-top:6px;font-size:18px}.research-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.panel{margin-bottom:16px}.chart-box{height:360px}.chart-box canvas{width:100%!important;height:100%!important}.indicator-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.indicator-grid>div{padding:13px;border:1px solid var(--line);border-radius:10px}.indicator-grid b{display:block;font-size:20px;margin:5px 0}.indicator-grid em{font-style:normal;color:var(--muted);font-size:12px}.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.profile-grid div{padding:10px 0;border-bottom:1px solid var(--line)}.profile-grid span{display:block;color:var(--muted);font-size:12px}.profile-grid b{display:block;margin-top:4px;overflow-wrap:anywhere}.loading,.error{padding:50px;text-align:center;color:var(--muted)}.back{display:inline-block;margin-bottom:12px;color:inherit;text-decoration:none;font-weight:800}@media(max-width:900px){.company-head{display:block}.quote{text-align:left;margin-top:18px}.meta-strip{grid-template-columns:repeat(2,1fr)}.research-grid{grid-template-columns:1fr}.chart-box{height:280px}}@media(max-width:480px){.research-wrap{padding:14px 10px 40px}.company-head{padding:16px}.quote strong{font-size:29px}.meta-strip{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric b{font-size:15px}.indicator-grid,.profile-grid{grid-template-columns:1fr}.chart-box{height:230px}}</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span><span><strong>NEPSE <b>Pulse</b></strong><small>नेपाल शेयर बजार</small></span></a><nav><a href="index.html">Market</a><a class="active" href="company.html">Research</a></nav><div class="top-actions"><span id="status" class="status"><i></i> Loading</span></div></header><main class="research-wrap"><a class="back" href="index.html">← Back to NEPSE</a><div class="search-panel"><input id="companySearch" autocomplete="off" placeholder="Search company name or symbol…"><div id="suggestions" class="suggestions" hidden></div></div><div id="app" class="loading">Loading company research…</div></main></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script>const BASE='./data/';let stocks=[],companies={},chart=null;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2}),pct=v=>`${Number(v||0)>=0?'+':''}${Number(v||0).toFixed(2)}%`;async function get(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+p);return r.json()}function norm(s){const l=Number(s.ltp??s.lastTradedPrice??s.lastPrice??s.price??0),c=Number(s.change??s.pointChange??s.changeAmount??0);return{...s,symbol:String(s.symbol??s.ticker??s.securitySymbol??'').toUpperCase(),name:String(s.name??s.companyName??s.company??s.securityName??''),ltp:l,change:c,pc:Number(s.percent_change??s.percentChange??s.percentageChange??(l-c?c/(l-c)*100:0)),previous:Number(s.previous_close??s.previousClose??l-c),open:Number(s.open??s.openPrice??0),high:Number(s.high??s.highPrice??0),low:Number(s.low??s.lowPrice??0),volume:Number(s.volume??s.totalTradedQuantity??0),turnover:Number(s.turnover??s.totalTradedValue??0)}}function sma(a,n){return a.length>=n?a.slice(-n).reduce((x,y)=>x+y,0)/n:null}function ema(a,n){if(a.length<n)return null;const k=2/(n+1);let e=a.slice(0,n).reduce((x,y)=>x+y,0)/n;for(let i=n;i<a.length;i++)e=a[i]*k+e*(1-k);return e}function rsi(a,n=14){if(a.length<=n)return null;let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}if(!l)return 100;return 100-100/(1+(g/n)/(l/n))}function signal(a){const last=a.at(-1),s20=sma(a,20),s50=sma(a,50),e20=ema(a,20),r=rsi(a);let score=0;if(s20&&last>s20)score++;if(s50&&last>s50)score++;if(e20&&last>e20)score++;if(r!=null&&r>=50)score++;return{score,r,s20,s50,e20,signal:score>=3?'BULLISH':score<=1?'BEARISH':'NEUTRAL'}}function render(sym,s,d){const company=companies[sym]||{},profile=company.profile||{},fin=company.financials||{};const reports=Array.isArray(fin.reports)?fin.reports:[];const latest=reports[reports.length-1]||{};const history=(d.history||[]).map(x=>norm(x.stock||x)).filter(x=>x.ltp>0);if(history.length<2)history.push(s);const a=history.map(x=>x.ltp),t=signal(a);$('#app').innerHTML=`<section class="company-head"><div><small>COMPREHENSIVE COMPANY RESEARCH</small><h1>${esc(s.name||sym)}</h1><span>${esc(company.sector||s.sector||profile.sector||'NEPSE listed company')} · ${esc(sym)}</span></div><div class="quote"><strong>Rs. ${fmt(s.ltp)}</strong><span class="${s.change>=0?'up':'down'}">${s.change>=0?'+':''}${fmt(s.change)} · ${pct(s.pc)}</span></div></section><section class="meta-strip">${[['Previous close',s.previous],['Open',s.open],['Day high',s.high],['Day low',s.low],['Volume',s.volume],['Turnover','Rs. '+fmt(s.turnover)]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${typeof x[1]==='number'?fmt(x[1]):x[1]}</b></div>`).join('')}</section><section class="research-grid"><div><section class="panel"><small>PRICE ACTION</small><h2>${esc(sym)} technical chart</h2><div class="chart-box"><canvas id="chart"></canvas></div><p style="color:var(--muted)">${history.length} stored observations</p></section><section class="panel"><small>TECHNICAL ANALYSIS</small><h2>Core indicators · <span class="${t.signal==='BULLISH'?'up':t.signal==='BEARISH'?'down':''}">${t.signal}</span></h2><div class="indicator-grid"><div><small>Technical score</small><b>${t.score}/4</b><em>Rule-based trend score</em></div><div><small>RSI 14</small><b>${t.r==null?'—':t.r.toFixed(1)}</b><em>${t.r>70?'Overbought':t.r<30?'Oversold':'Neutral'}</em></div><div><small>SMA 20</small><b>${t.s20?fmt(t.s20):'—'}</b><em>Short trend</em></div><div><small>SMA 50</small><b>${t.s50?fmt(t.s50):'—'}</b><em>Medium trend</em></div><div><small>EMA 20</small><b>${t.e20?fmt(t.e20):'—'}</b><em>Momentum</em></div></div></section></div><aside><section class="panel"><small>COMPANY PROFILE</small><h2>Company details</h2><div class="profile-grid">${[['Symbol',sym],['Sector',company.sector||s.sector||profile.sector||'—'],['Address',profile.address],['Website',profile.website],['Email',profile.email]].filter(x=>x[1]).map(x=>`<div><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')||'<p>Profile data unavailable.</p>'}</div></section><section class="panel"><small>FINANCIAL SNAPSHOT</small><h2>Latest available report</h2><div class="profile-grid">${Object.entries(latest).filter(([k,v])=>!['documents'].includes(k)&&v!==null&&v!==undefined&&v!=='').slice(0,12).map(([k,v])=>`<div><span>${esc(k.replaceAll('_',' '))}</span><b>${typeof v==='number'?fmt(v):esc(v)}</b></div>`).join('')||'<p>Financial data unavailable.</p>'}</div></section></aside></section>`;if(chart)chart.destroy();chart=new Chart($('#chart'),{type:'line',data:{labels:history.map(x=>x.timestamp||''),datasets:[{label:'LTP',data:a,borderColor:'#b88718',backgroundColor:'rgba(184,135,24,.10)',fill:true,pointRadius:0,borderWidth:2,tension:.2},{label:'SMA20',data:a.map((_,i)=>i<19?null:a.slice(i-19,i+1).reduce((x,y)=>x+y,0)/20),borderColor:'#64748b',pointRadius:0,borderWidth:1.2}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{display:false},y:{beginAtZero:false}},plugins:{legend:{position:'top',align:'end'}}}})}async function openSymbol(sym){sym=String(sym||'').trim().toUpperCase();const s=stocks.find(x=>x.symbol===sym);if(!s){$('#app').innerHTML='<div class="error">Company not found.</div>';return}history.replaceState(null,'',`company.html?symbol=${encodeURIComponent(sym)}`);$('#app').innerHTML='<div class="loading">Loading company research…</div>';try{let d;try{d=await get(`stock/${sym.toLowerCase()}/data.json`)}catch(e){d={stock:s,history:[{timestamp:new Date().toISOString(),stock:s}]}}render(sym,norm(d.stock||s),d);$('#status').innerHTML='<i></i> Data ready'}catch(e){console.error(e);render(sym,s,{history:[{timestamp:new Date().toISOString(),stock:s}]})}}function show(){const q=$('#companySearch').value.trim().toLowerCase();const list=stocks.filter(s=>!q||s.symbol.toLowerCase().includes(q)||s.name.toLowerCase().includes(q)).slice(0,12);$('#suggestions').innerHTML=list.map(s=>`<button data-symbol="${esc(s.symbol)}"><span>${esc(s.name)}</span><b>${esc(s.symbol)}</b></button>`).join('')||'<div style="padding:14px">No company found</div>';$('#suggestions').hidden=false}$('#companySearch').addEventListener('input',show);$('#companySearch').addEventListener('focus',show);$('#suggestions').addEventListener('mousedown',e=>{const b=e.target.closest('[data-symbol]');if(b){e.preventDefault();openSymbol(b.dataset.symbol)}});document.addEventListener('click',e=>{if(!e.target.closest('.search-panel'))$('#suggestions').hidden=true});(async()=>{try{const[l,c]=await Promise.all([get('live.json'),get('companies.json').catch(()=>({companies:{}}))]);stocks=(Array.isArray(l)?l:l.stocks||l.data||[]).map(norm).filter(x=>x.symbol);companies=c.companies||{};$('#status').innerHTML='<i></i> Data ready';const requested=new URLSearchParams(location.search).get('symbol');if(requested)openSymbol(requested);else{$('#app').innerHTML='<div class="loading">Search or select a company to open its complete research.</div>';show()}}catch(e){console.error(e);$('#status').innerHTML='<i></i> Data unavailable';$('#app').innerHTML='<div class="error">Company data unavailable. Refresh after the next market-data update.</div>'}})();</script></body></html>
