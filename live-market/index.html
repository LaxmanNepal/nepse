<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071827"><title>Live Market | NEPSE Pulse</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../app.css"><style>.terminal-page{max-width:1400px;margin:auto;padding:20px 16px 90px}.live-hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:14px}.live-hero h1{font-size:30px;margin:4px 0}.live-hero p{margin:0;color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px}.metric small{display:block;color:var(--muted);font-size:8px}.metric b{display:block;font-size:18px;margin-top:5px}.toolbar{position:sticky;top:64px;z-index:30;display:flex;gap:7px;align-items:center;padding:10px;background:var(--surface-strong);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;backdrop-filter:blur(18px)}.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);background:var(--surface-strong);color:var(--text);border-radius:11px;padding:0 10px;outline:0}.toolbar input{flex:1}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:7px 11px;font-size:9px;font-weight:800;cursor:pointer}.tabs button.active{background:#071827;color:#fff}.market-table{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;backdrop-filter:blur(18px)}.table-scroll{overflow:auto}.market-table table{width:100%;min-width:900px;border-collapse:collapse}.market-table th{background:rgba(248,250,252,.55);padding:10px 12px;text-align:left;color:var(--muted);font-size:7px;letter-spacing:.7px}.market-table td{padding:11px 12px;border-top:1px solid var(--line);font-size:9px}.market-table tbody tr{cursor:pointer}.market-table tbody tr:hover{background:rgba(255,255,255,.28)}.sym{font-weight:900;color:var(--text)}.name{color:var(--muted);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.positive{color:var(--up);font-weight:800}.negative{color:var(--down);font-weight:800}.empty{text-align:center;padding:50px;color:var(--muted)}.footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:9px}.pager{display:flex;gap:4px}.pager button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:6px 9px;cursor:pointer}.pager button.active{background:#071827;color:#fff}@media(max-width:760px){.terminal-page{padding:12px 8px 96px}.live-hero{display:block}.live-hero h1{font-size:24px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:1/-1}.toolbar{top:58px;flex-wrap:wrap}.toolbar input{flex-basis:100%}.toolbar select{flex:1;min-width:0}.market-table{border-radius:14px}.footer-row{align-items:flex-start;gap:8px;flex-direction:column}}</style></head><body><div class="app-shell"><header class="topbar"></header><main class="terminal-page"><section class="live-hero"><div><div class="eyebrow">NEPSE PULSE · LIVE MARKET</div><h1>All securities</h1><p>Every security available in the canonical live market snapshot, with fast filtering and sorting.</p></div><div id="updated">Loading…</div></section><section class="metrics"><div class="metric"><small>SECURITIES</small><b id="total">—</b></div><div class="metric"><small>GAINERS</small><b id="gainers" class="positive">—</b></div><div class="metric"><small>LOSERS</small><b id="losers" class="negative">—</b></div><div class="metric"><small>UNCHANGED</small><b id="unchanged">—</b></div><div class="metric"><small>TOTAL TURNOVER</small><b id="turnover">—</b></div></section><div class="tabs" id="tabs"><button class="active" data-filter="all">All</button><button data-filter="gainers">Gainers</button><button data-filter="losers">Losers</button><button data-filter="unchanged">Unchanged</button><button data-filter="highvolume">High volume</button></div><div class="toolbar"><input id="q" placeholder="Filter symbol or company name…"><select id="sector"><option value="all">All sectors</option></select><select id="sort"><option value="symbol">Symbol A–Z</option><option value="change">Change % ↓</option><option value="changeUp">Change % ↑</option><option value="turnover">Turnover ↓</option><option value="volume">Volume ↓</option></select></div><section class="market-table"><div class="table-scroll"><table><thead><tr><th>SYMBOL</th><th>COMPANY</th><th>LTP</th><th>CHANGE</th><th>CH %</th><th>OPEN</th><th>HIGH</th><th>LOW</th><th>VOLUME</th><th>TURNOVER</th><th>TRADES</th></tr></thead><tbody id="body"><tr><td colspan="11" class="empty">Loading market…</td></tr></tbody></table></div></section><div class="footer-row"><span id="showing">—</span><div class="pager" id="pager"></div></div></main></div><script src="../shared-header.js"></script><script>let stocks=[],filtered=[],filter='all',page=1;const per=75,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function norm(s){const l=Number(s.ltp??s.lastTradedPrice??s.lastPrice??0),c=Number(s.change??s.pointChange??s.changeAmount??0);return{symbol:String(s.symbol??s.ticker??s.securitySymbol??'').toUpperCase(),name:String(s.name??s.companyName??s.company??s.securityName??'').trim(),sector:String(s.sector??s.sectorName??'').trim(),ltp:l,change:c,pc:Number(s.percent_change??s.percentChange??s.percentageChange??(l-c?c/(l-c)*100:0)),open:Number(s.open??s.openPrice??0),high:Number(s.high??s.highPrice??0),low:Number(s.low??s.lowPrice??0),volume:Number(s.volume??s.totalTradedQuantity??0),turnover:Number(s.turnover??s.totalTradedValue??0),trades:Number(s.trades??s.totalTrades??0)}}async function load(){try{const r=await fetch('../data/live.json?'+Date.now(),{cache:'no-store'}),d=await r.json();stocks=(d.stocks||d.data||d).map(norm).filter(x=>x.symbol);const secs=[...new Set(stocks.map(x=>x.sector).filter(Boolean))].sort();$('#sector').innerHTML='<option value="all">All sectors</option>'+secs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('#updated').textContent=d.updatedAt?`Snapshot: ${new Date(d.updatedAt).toLocaleString()}`:'Latest available snapshot';render()}catch{$('#body').innerHTML='<tr><td colspan="11" class="empty">Market data unavailable.</td></tr>'}}function percentile(p){const a=stocks.map(x=>x.volume).sort((a,b)=>a-b);return a.length?a[Math.floor((a.length-1)*p)]:0}function render(){const q=$('#q').value.trim().toLowerCase(),sec=$('#sector').value,sort=$('#sort').value;filtered=stocks.filter(x=>{const match=!q||`${x.symbol} ${x.name}`.toLowerCase().includes(q),sector=sec==='all'||x.sector===sec,kind=filter==='all'||filter==='gainers'&&x.pc>0||filter==='losers'&&x.pc<0||filter==='unchanged'&&x.pc===0||filter==='highvolume'&&x.volume>=percentile(.9);return match&&sector&&kind});if(sort==='change')filtered.sort((a,b)=>b.pc-a.pc);else if(sort==='changeUp')filtered.sort((a,b)=>a.pc-b.pc);else if(sort==='turnover')filtered.sort((a,b)=>b.turnover-a.turnover);else if(sort==='volume')filtered.sort((a,b)=>b.volume-a.volume);else filtered.sort((a,b)=>a.symbol.localeCompare(b.symbol));const pages=Math.max(1,Math.ceil(filtered.length/per));page=Math.min(page,pages);const slice=filtered.slice((page-1)*per,page*per);$('#body').innerHTML=slice.map(x=>`<tr onclick="location.href='../stock/${encodeURIComponent(x.symbol.toLowerCase())}/'"><td class="sym">${esc(x.symbol)}</td><td class="name">${esc(x.name)}</td><td>${x.ltp.toLocaleString('en-IN',{maximumFractionDigits:2})}</td><td class="${x.change>=0?'positive':'negative'}">${x.change>=0?'+':''}${x.change.toLocaleString('en-IN',{maximumFractionDigits:2})}</td><td class="${x.pc>=0?'positive':'negative'}">${x.pc>=0?'+':''}${x.pc.toFixed(2)}%</td><td>${x.open.toLocaleString('en-IN',{maximumFractionDigits:2})}</td><td>${x.high.toLocaleString('en-IN',{maximumFractionDigits:2})}</td><td>${x.low.toLocaleString('en-IN',{maximumFractionDigits:2})}</td><td>${x.volume.toLocaleString('en-IN')}</td><td>Rs. ${x.turnover.toLocaleString('en-IN',{maximumFractionDigits:0})}</td><td>${x.trades.toLocaleString('en-IN')}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">No securities match your filters.</td></tr>';$('#showing').textContent=`Showing ${filtered.length?((page-1)*per+1).toLocaleString():'0'}–${Math.min(page*per,filtered.length).toLocaleString()} of ${filtered.length.toLocaleString()}`;$('#pager').innerHTML=Array.from({length:Math.min(pages,10)},(_,i)=>`<button class="${i+1===page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');$('#pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;render()});$('#total').textContent=stocks.length.toLocaleString();$('#gainers').textContent=stocks.filter(x=>x.pc>0).length.toLocaleString();$('#losers').textContent=stocks.filter(x=>x.pc<0).length.toLocaleString();$('#unchanged').textContent=stocks.filter(x=>x.pc===0).length.toLocaleString();$('#turnover').textContent='Rs. '+stocks.reduce((a,x)=>a+x.turnover,0).toLocaleString('en-IN',{maximumFractionDigits:0})}$('#q').addEventListener('input',()=>{page=1;render()});$('#sector').addEventListener('change',()=>{page=1;render()});$('#sort').addEventListener('change',()=>{page=1;render()});$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.filter;page=1;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});load();setInterval(load,60000);</script></body></html>
