<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Stock Research | NEPSE Pulse</title><meta id="desc" name="description" content="NEPSE company research"><link rel="stylesheet" href="../../style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>.stock-app{max-width:1280px;margin:auto;padding:18px 14px 60px}.sr-nav{position:sticky;top:0;z-index:20;background:#07111f;color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sr-nav a{color:#fff;text-decoration:none;font-weight:800}.sr-search{flex:1;max-width:520px;position:relative}.sr-search input{width:100%;height:40px;border:1px solid #344256;border-radius:8px;background:#111d2c;color:#fff;padding:0 13px}.suggestions{position:absolute;left:0;right:0;top:46px;background:#fff;color:#111;border-radius:10px;box-shadow:0 14px 35px #0005;overflow:hidden;display:none;max-height:360px;overflow-y:auto}.suggestions.show{display:block}.suggestion{display:flex;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid #eee;text-decoration:none;color:#111}.suggestion:hover,.suggestion.active{background:#f5f7fa}.suggestion b{font-size:13px}.suggestion small{color:#667085}.sr-status{font-size:12px}.sr-hero{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:22px 0 16px}.sr-eyebrow{font-size:10px;letter-spacing:.1em;color:#667085;font-weight:900}.sr-symbol{color:#b88718;font-weight:900;margin:4px 0}.sr-hero h1{margin:0;font-size:30px}.sr-sector{color:#667085;margin-top:5px}.sr-price{text-align:right}.sr-price strong{display:block;font-size:38px}.sr-up{color:#087443}.sr-down{color:#c43232}.sr-session{background:#07111f;color:#e5eaf1;padding:11px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px}.sr-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#e4e7ec;margin:16px 0}.sr-stat{background:#fff;padding:13px}.sr-stat small{display:block;color:#667085;font-size:10px;font-weight:900;text-transform:uppercase}.sr-stat b{display:block;margin-top:6px}.sr-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px}.sr-card{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:17px;margin-bottom:16px}.sr-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.sr-head h2{font-size:18px;margin:4px 0 14px}.sr-ranges{display:flex;gap:4px;overflow:auto}.sr-ranges button{border:1px solid #e4e7ec;background:#fff;border-radius:6px;padding:7px 10px;font-weight:800}.sr-ranges button.active{background:#07111f;color:#fff}.sr-chart{height:380px}.sr-signal{padding:7px 11px;border-radius:6px;font-weight:900;background:#fff5d9;color:#8a6500}.sr-signal.buy{background:#eaf7f0;color:#087443}.sr-signal.sell{background:#fceeee;color:#c43232}.sr-decision{display:flex;gap:18px;align-items:center}.sr-score{width:84px;height:84px;border:7px solid #b88718;border-radius:50%;display:grid;place-content:center;text-align:center;flex:none}.sr-score b{font-size:23px}.sr-indicators{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px}.sr-indicator{border:1px solid #e4e7ec;padding:11px}.sr-indicator small{color:#667085;font-size:10px}.sr-indicator b{display:block;margin-top:5px}.sr-reasons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.sr-reasons div{border:1px solid #e4e7ec;padding:12px;border-radius:7px}.sr-reasons h3{font-size:12px;margin:0 0 8px}.sr-reasons ul{padding-left:18px;margin:0;color:#667085;font-size:12px;line-height:1.8}.good{color:#087443}.risk{color:#c43232}.sr-news a{display:block;color:inherit;text-decoration:none;border-top:1px solid #e4e7ec;padding:12px 0}.sr-news a:first-child{border-top:0}.sr-news b{font-size:13px;line-height:1.45}.sr-news small{display:block;color:#667085;margin-top:4px}.sr-muted{color:#667085;font-size:12px;line-height:1.6}.sr-loading,.sr-error{padding:50px;text-align:center;background:#fff;border:1px solid #e4e7ec;border-radius:8px}.sr-error a{color:#b88718;font-weight:800}.range-note{font-size:11px;color:#667085;margin:5px 0 0}@media(max-width:800px){.sr-nav{flex-wrap:wrap}.sr-search{order:3;flex-basis:100%;max-width:none}.sr-hero{display:block}.sr-price{text-align:left;margin-top:12px}.sr-price strong{font-size:31px}.sr-hero h1{font-size:23px}.sr-stats{grid-template-columns:repeat(2,1fr)}.sr-grid{grid-template-columns:1fr}.sr-chart{height:290px}.sr-indicators{grid-template-columns:repeat(2,1fr)}.sr-reasons{grid-template-columns:1fr}.suggestions{position:fixed;left:10px;right:10px;top:112px;max-height:55vh}}</style></head><body><header class="sr-nav"><a href="../../">← NEPSE Pulse</a><a href="../../news/">News</a><a href="../../ipos/">IPO</a><div class="sr-search"><input id="q" placeholder="कम्पनी वा symbol खोज्नुहोस्…" autocomplete="off"><div id="suggestions" class="suggestions"></div></div><span id="status" class="sr-status">Loading…</span></header><main class="stock-app"><div id="app" class="sr-loading">Loading company research…</div></main><script>const ROOT='../../',symbol=location.pathname.split('/').filter(Boolean).pop().toUpperCase(),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2}),pct=v=>`${Number(v)>=0?'+':''}${Number(v||0).toFixed(2)}%`;let data,chart,range='1D',universe=[],activeSuggestion=-1;async function get(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function sname(s){return s.name||s.companyName||s.company||s.securityName||symbol}function ltp(s){return Number(s.ltp??s.lastTradedPrice??s.lastPrice??0)}function change(s){return Number(s.change??s.pointChange??s.changeAmount??0)}function percent(s){return Number(s.percent_change??s.percentChange??s.percentageChange??0)}function rows(){return(data.history||[]).map(x=>{const s=x.stock||x;return{time:x.timestamp,ltp:ltp(s)}}).filter(x=>x.ltp>0).sort((a,b)=>a.time.localeCompare(b.time))}function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}function nepDate(){return new Intl.DateTimeFormat('ne-NP-u-ca-bikram-sambat',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Kathmandu'}).format(new Date())}function openNow(){const p=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'2-digit',hour12:false,timeZone:'Asia/Kathmandu'}).formatToParts(new Date()),h=+p.find(x=>x.type==='hour').value;return['Mon','Tue','Wed','Thu','Fri'].includes(p.find(x=>x.type==='weekday').value)&&h>=11&&h<15}function render(){const s=data.stock,t=data.technical||{},r=rows(),up=change(s)>=0;document.title=`${sname(s)} (${symbol}) Share Price, Analysis & News | NEPSE Pulse`;$('#desc').content=`${sname(s)} (${symbol}) share price, technical analysis, chart and latest news on NEPSE Pulse.`;const prev=Number(s.previous_close??s.previousClose??ltp(s)-change(s));const indicators=[['RSI 14',t.rsi],['SMA 20',t.sma20],['SMA 50',t.sma50],['SMA 200',t.sma200],['EMA 20',t.ema20],['MACD',t.macd]];const news=data.news||[];$('#app').innerHTML=`<section class="sr-hero"><div><div class="sr-eyebrow">COMPREHENSIVE STOCK RESEARCH</div><div class="sr-symbol">${esc(symbol)}</div><h1>${esc(sname(s))}</h1><div class="sr-sector">${esc(s.sector||s.sectorName||'NEPSE listed company')}</div></div><div class="sr-price"><strong>Rs. ${num(ltp(s))}</strong><span class="${up?'sr-up':'sr-down'}">${up?'+':''}${num(change(s))} (${pct(percent(s))})</span></div></section><section class="sr-session"><span>${openNow()?'● Market open — live window':'● Market closed — latest available data'}</span><b>${nepDate()} · Nepal Time</b></section><section class="sr-stats">${[['Previous close',prev],['Open',s.open],['High',s.high],['Low',s.low],['Volume',s.volume??s.totalTradedQuantity],['Turnover',s.turnover??s.totalTradedValue]].map(x=>`<div class="sr-stat"><small>${x[0]}</small><b>${x[0]==='Turnover'?'Rs. ':''}${num(x[1])}</b></div>`).join('')}</section><section class="sr-grid"><div><section class="sr-card"><div class="sr-head"><div><div class="sr-eyebrow">PRICE ACTION</div><h2>${esc(symbol)} chart</h2><p class="range-note" id="rangeNote"></p></div><div class="sr-ranges">${['1D','7D','1M','3M','6M','1Y'].map(x=>`<button class="${range===x?'active':''}" data-range="${x}">${x}</button>`).join('')}</div></div><div class="sr-chart"><canvas id="chart"></canvas></div></section><section class="sr-card"><div class="sr-head"><div><div class="sr-eyebrow">TECHNICAL DECISION</div><h2>Buy / Hold / Sell</h2></div><span class="sr-signal ${(t.signal||'HOLD').toLowerCase()}">${esc(t.signal||'HOLD')}</span></div><div class="sr-decision"><div class="sr-score"><b>${t.score??'—'}</b><small>/100</small></div><div><h3>${t.signal==='BUY'?'Bullish setup':t.signal==='SELL'?'Bearish setup':'Wait for confirmation'}</h3><p class="sr-muted">Rule-based technical signal using trend and momentum. It is not a guarantee or financial advice.</p></div></div><div class="sr-indicators">${indicators.map(x=>`<div class="sr-indicator"><small>${x[0]}</small><b>${x[1]==null?'—':num(x[1])}</b></div>`).join('')}</div><div class="sr-reasons"><div><h3 class="good">Bullish factors</h3><ul>${(t.reasons||['Insufficient historical data']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3 class="risk">Risks</h3><ul>${(t.risks||['Insufficient historical data']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></section></div><aside><section class="sr-card"><div class="sr-eyebrow">LATEST COMPANY NEWS</div><h2>${esc(symbol)} News</h2><div class="sr-news">${news.length?news.map(n=>`<a href="${esc(n.url)}" target="_blank" rel="noopener"><b>${esc(n.title||'Company update')}</b><small>${esc(n.source||'Finance source')} · ${esc(n.published||'Latest')}</small></a>`).join(''):'<p class="sr-muted">No verified company-linked news yet.</p>'}</div></section><section class="sr-card"><div class="sr-eyebrow">DATA INTEGRITY</div><h2>Market participant data</h2><p class="sr-muted">Individual buyer/seller/holder counts are not published by the current verified dataset. NEPSE Pulse will not invent these numbers. Verified bid/ask or participant data will be shown here when available.</p></section></aside></section>`;draw(r);document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()})}function filtered(r){const mins={1D:1,7D:5,1M:22,3M:66,6M:132,1Y:264};const wanted=mins[range]||1;const n=Math.min(r.length,wanted*240);return r.slice(-n)}function draw(r){if(chart)chart.destroy();const x=filtered(r),a=x.map(v=>v.ltp);$('#rangeNote').textContent=x.length<2?'Not enough stored history for this range yet.':'Showing '+x.length.toLocaleString()+' stored observations. Longer ranges become available as the collector accumulates history.';chart=new Chart($('#chart'),{type:'line',data:{labels:x.map(v=>new Date(v.time).toLocaleString('ne-NP',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kathmandu'})),datasets:[{label:'LTP',data:a,borderWidth:2,pointRadius:0,tension:.18},{label:'SMA 20',data:sma(a,20),borderWidth:1,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{x:{ticks:{maxTicksLimit:8}},y:{beginAtZero:false}}}})}function showSuggestions(){const q=$('#q').value.trim().toLowerCase(),box=$('#suggestions');if(!q){box.classList.remove('show');return}const list=universe.filter(s=>`${s.symbol||s.ticker||''} ${s.name||s.companyName||s.company||''}`.toLowerCase().includes(q)).slice(0,12);box.innerHTML=list.length?list.map((s,i)=>{const sy=(s.symbol||s.ticker||'').toUpperCase(),nm=s.name||s.companyName||s.company||sy;return `<a class="suggestion ${i===activeSuggestion?'active':''}" href="${ROOT}stock/${encodeURIComponent(sy.toLowerCase())}/"><b>${esc(sy)}</b><small>${esc(nm)}</small></a>`}).join(''):'<div class="suggestion"><small>No matching company</small></div>';box.classList.add('show')}async function loadUniverse(){try{const x=await get(ROOT+'data/live.json');universe=x.stocks||x.data||[]}catch(e){universe=[]}}$('#q').addEventListener('input',()=>{activeSuggestion=-1;showSuggestions()});$('#q').addEventListener('keydown',e=>{const links=[...document.querySelectorAll('.suggestion[href]')];if(e.key==='ArrowDown'){e.preventDefault();activeSuggestion=Math.min(activeSuggestion+1,links.length-1);showSuggestions()}if(e.key==='ArrowUp'){e.preventDefault();activeSuggestion=Math.max(activeSuggestion-1,0);showSuggestions()}if(e.key==='Enter'&&links[activeSuggestion])location.href=links[activeSuggestion].href;if(e.key==='Escape')$('#suggestions').classList.remove('show')});document.addEventListener('click',e=>{if(!e.target.closest('.sr-search'))$('#suggestions').classList.remove('show')});async function boot(){try{await loadUniverse();data=await get('data.json');if(!data.stock)throw Error('invalid company data');$('#status').textContent='Data ready';render()}catch(e){console.error(e);$('#status').textContent='Data error';$('#app').innerHTML=`<section class="sr-error"><h2>Company data unavailable</h2><p>Could not load generated data for <b>${esc(symbol)}</b>.</p><a href="../../">← Back to NEPSE</a></section>`}}boot();</script></body></html>
