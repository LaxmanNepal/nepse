<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Stock Research | NEPSE Pulse</title><meta name="description" content="NEPSE stock price, intraday history and technical research."><link rel="stylesheet" href="../../style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script></head><body><div class="terminal"><header class="terminal-nav"><a href="../../" class="back">← NEPSE Pulse</a><div class="nav-search"><input id="search" autocomplete="off" placeholder="Search company or symbol…"><div id="suggestions"></div></div><div id="clock">Market</div></header><main id="app"><div class="loading">Loading company research…</div></main></div><script src="../../technical.js"></script><script>
const ROOT='../../',DATA='../../data/',sym=location.pathname.split('/').filter(Boolean).at(-1).toUpperCase(),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2}),pct=v=>`${Number(v)>=0?'+':''}${Number(v||0).toFixed(2)}%`,get=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()};
let stocks=[],snapshots=[],chart,volumeChart,selected=sym,range='1D';
function stockSymbol(s){return String(s.symbol||s.ticker||s.securitySymbol||'').toUpperCase()}function stockName(s){return s.name||s.companyName||s.company||s.securityName||stockSymbol(s)}function ltp(s){return Number(s.ltp??s.lastTradedPrice??s.lastPrice??0)}function change(s){return Number(s.change??s.pointChange??s.changeAmount??0)}function percent(s){return Number(s.percent_change??s.percentChange??s.percentageChange??(ltp(s)-Number(s.previous_close??s.previousClose??ltp(s)))/Math.max(Number(s.previous_close??s.previousClose??ltp(s)),1)*100)}function nepaliDate(d){return new Intl.DateTimeFormat('ne-NP-u-ca-bikram-sambat',{year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:'Asia/Kathmandu'}).format(d)}function nepaliTime(d){return new Intl.DateTimeFormat('ne-NP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,timeZone:'Asia/Kathmandu'}).format(d)}function marketOpen(d=new Date()){const parts=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Kathmandu'}).formatToParts(d),w=parts.find(x=>x.type==='weekday').value,h=Number(parts.find(x=>x.type==='hour').value),m=Number(parts.find(x=>x.type==='minute').value);return ['Mon','Tue','Wed','Thu','Fri'].includes(w)&&((h>11||h===11&&m>=0)&&h<15)}
function find(s){return stocks.find(x=>stockSymbol(x)===s)}function current(){return find(selected)}
function technical(rows){const vals=rows.map(x=>x.ltp);if(vals.length<20)return {score:null,signal:'HOLD',reasons:['Not enough historical observations for a reliable technical score']};const high=rows.map(x=>x.high||x.ltp),low=rows.map(x=>x.low||x.ltp);return NEPSETechnical.analyze(vals,high,low)}
function buildSeries(){let all=[];snapshots.forEach(sn=>{const s=(sn.stocks||[]).find(x=>stockSymbol(x)===selected);if(s)all.push({time:sn.timestamp,ltp:ltp(s),high:Number(s.high||ltp(s)),low:Number(s.low||ltp(s)),volume:Number(s.volume??s.totalTradedQuantity??0)})});all.sort((a,b)=>a.time.localeCompare(b.time));return all}
function render(){const s=current();if(!s){$('#app').innerHTML='<section class="error"><h1>Stock not found</h1><p>The symbol '+esc(sym)+' is not available in the current market dataset.</p><a href="../../">Return to NEPSE</a></section>';return}const ch=change(s),pc=percent(s),series=buildSeries(),t=technical(series),now=new Date(),open=marketOpen(now),prev=Number(s.previous_close??s.previousClose??ltp(s)-ch);document.title=`${stockName(s)} (${selected}) Share Price & Technical Analysis | NEPSE Pulse`;$('#app').innerHTML=`<section class="stock-head"><div><div class="eyebrow">NEPSE STOCK RESEARCH</div><div class="symbol">${esc(selected)}</div><h1>${esc(stockName(s))}</h1><div class="subline">${esc(s.sector||s.sectorName||'NEPSE listed company')} · ${open?'Market open':'Market closed'}</div></div><div class="quote"><strong>Rs. ${num(ltp(s))}</strong><span class="${ch>=0?'positive':'negative'}">${ch>=0?'+':''}${num(ch)} (${pc.toFixed(2)}%)</span></div></section><section class="market-strip"><span><i class="${open?'live':'closed'}"></i>${open?'Live market window':'Latest available market data'}</span><b>नेपाली मिति ${nepaliDate(now)} · ${nepaliTime(now)}</b></section><section class="stats">${[['Previous close',`Rs. ${num(prev)}`],['Open',`Rs. ${num(s.open)}`],['High',`Rs. ${num(s.high)}`],['Low',`Rs. ${num(s.low)}`],['Volume',num(s.volume??s.totalTradedQuantity)],['Turnover',`Rs. ${num(s.turnover??s.totalTradedValue)}`]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</section><section class="layout"><div><section class="panel chart-panel"><div class="panel-head"><div><small>PRICE ACTION</small><h2>${esc(selected)} chart</h2></div><div class="ranges">${['1D','1W','1M','3M','6M','1Y'].map(r=>`<button class="${range===r?'active':''}" data-range="${r}">${r}</button>`).join('')}</div></div><div class="chart-wrap"><canvas id="priceChart"></canvas></div><div class="chart-note">${series.length} verified snapshots available in the current static intraday archive.</div></section><section class="panel"><div class="panel-head"><div><small>TECHNICAL ANALYSIS</small><h2>Decision engine</h2></div><span class="signal ${t.signal.toLowerCase()}">${t.signal}</span></div><div class="decision"><div class="score-ring"><strong>${t.score??'—'}</strong><span>/100</span></div><div><h3>${t.signal==='BUY'?'Bullish setup':t.signal==='SELL'?'Bearish setup':'Mixed / wait for confirmation'}</h3><p>This is a rule-based technical signal, not a guaranteed prediction or personal investment advice.</p><div class="reasons">${(t.reasons||[]).map(r=>`<span>✓ ${esc(r)}</span>`).join('')}</div></div></div><div class="indicator-grid">${[['RSI 14',t.rsi],['SMA 20',t.s20],['SMA 50',t.s50],['EMA 20',t.ema20],['MACD',t.macd],['ADX',t.adx],['ATR',t.atr],['BB Upper',t.bbUpper]].map(x=>`<div><small>${x[0]}</small><b>${x[1]==null?'—':num(x[1])}</b></div>`).join('')}</div></section></div><aside><section class="panel"><small>MARKET ACTIVITY</small><h2>Order flow</h2><div class="flow"><div><b>Buy</b><strong>—</strong><small>Verified buyer count unavailable</small></div><div><b>Sell</b><strong>—</strong><small>Verified seller count unavailable</small></div><div><b>Hold</b><strong>—</strong><small>Holder count unavailable</small></div></div><p class="muted">The current public source does not expose the number of individual people buying, selling or holding this stock. The app will never invent these figures.</p></section><section class="panel"><small>RESEARCH CHECKLIST</small><h2>What to inspect</h2><ul class="checklist"><li>Trend versus SMA 20/50</li><li>RSI momentum</li><li>MACD direction</li><li>Volume confirmation</li><li>Support and resistance</li><li>Latest financial statements</li><li>Dividend and corporate actions</li></ul></section></aside></section>`;draw(series,t);document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()})}
function filteredSeries(series){if(range==='1D')return series.slice(-300);const days={1W:5,1M:22,3M:66,6M:132,1Y:260};return series.slice(-(days[range]||series.length))}
function draw(series,t){if(chart)chart.destroy();const rows=filteredSeries(series);chart=new Chart($('#priceChart'),{type:'line',data:{labels:rows.map(x=>new Date(x.time).toLocaleTimeString('ne-NP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kathmandu'})),datasets:[{label:'LTP',data:rows.map(x=>x.ltp),borderWidth:2,pointRadius:0,tension:.18},{label:'SMA 20',data:NEPSETechnical.sma(rows.map(x=>x.ltp),20),borderWidth:1,pointRadius:0,tension:.15},{label:'SMA 50',data:NEPSETechnical.sma(rows.map(x=>x.ltp),50),borderWidth:1,pointRadius:0,tension:.15}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{x:{ticks:{maxTicksLimit:8}},y:{beginAtZero:false}}}})}
async function boot(){try{const d=await get(DATA+'live.json').catch(()=>get('https://shubhamnpk.github.io/yonepse/data/nepse_data.json'));stocks=Array.isArray(d)?d:(d.stocks||d.data||[]);const now=new Date(),date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kathmandu'}).format(now);const h=await get(DATA+'intraday/'+date+'.json').catch(()=>({snapshots:[]}));snapshots=h.snapshots||[];render();$('#clock').textContent=marketOpen(now)?'● Market Open':'Market Closed';setInterval(async()=>{try{const live=await get(DATA+'live.json?ts='+Date.now());stocks=live.stocks||[];render()}catch(e){}},60000);const input=$('#search');input.oninput=()=>{const q=input.value.toLowerCase().trim();const a=stocks.filter(s=>(stockName(s)+' '+stockSymbol(s)).toLowerCase().includes(q)).slice(0,8);$('#suggestions').innerHTML=a.map(s=>`<button data-s="${esc(stockSymbol(s))}"><b>${esc(stockName(s))}</b><span>${esc(stockSymbol(s))}</span></button>`).join('');$('#suggestions').classList.toggle('show',!!q)};$('#suggestions').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;location.href=ROOT+'stock/'+b.dataset.s.toLowerCase()+'/'};}catch(e){$('#app').innerHTML='<section class="error"><h1>Market data unavailable</h1><p>Unable to load the current NEPSE data source.</p></section>'}}boot();
</script><style>
