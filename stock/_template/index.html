<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Stock Research | NEPSE Pulse</title><link rel="stylesheet" href="../../style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script></head><body><main class="stock-terminal"><header class="stock-top"><a href="../../">← NEPSE Pulse</a><span id="marketClock">Market</span></header><section id="company"></section></main><script src="../../technical.js"></script><script>const API='https://shubhamnpk.github.io/yonepse/data';const sym=location.pathname.split('/').filter(Boolean).at(-1).toUpperCase();const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});async function get(p){const r=await fetch(API+p,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function pick(d){const a=Array.isArray(d)?d:d.data||d.stocks||[];return a.find(x=>(x.symbol||x.ticker||x.securitySymbol||'').toUpperCase()===sym)}function signal(s){const p=Number(s.ltp||s.lastTradedPrice||s.lastPrice||0),c=Number(s.change||s.pointChange||0);return c>0?'HOLD / WATCH':c<0?'HOLD / WATCH':'HOLD'}async function boot(){try{const d=await get('/nepse_data.json'),s=pick(d);if(!s){$('#company').innerHTML='<h1>Stock not found</h1>';return}const name=s.name||s.companyName||s.company||s.securityName||sym,ltp=Number(s.ltp??s.lastTradedPrice??s.lastPrice??0),chg=Number(s.change??s.pointChange??0),pc=Number(s.percent_change??s.percentChange??0);$('#company').innerHTML=`<section class="stock-hero"><div><small>NEPSE STOCK RESEARCH</small><div class="stock-symbol">${esc(sym)}</div><h1>${esc(name)}</h1><p>Comprehensive market and technical research</p></div><div class="stock-price"><strong>Rs. ${n(ltp)}</strong><b class="${chg>=0?'up':'down'}">${chg>=0?'+':''}${n(chg)} (${pc.toFixed(2)}%)</b></div></section><section class="stock-grid"><div class="stock-card"><small>Previous close</small><b>Rs. ${n(s.previous_close??s.previousClose??ltp-chg)}</b></div><div class="stock-card"><small>Day high</small><b>Rs. ${n(s.high)}</b></div><div class="stock-card"><small>Day low</small><b>Rs. ${n(s.low)}</b></div><div class="stock-card"><small>Volume</small><b>${n(s.volume??s.totalTradedQuantity)}</b></div><div class="stock-card"><small>Turnover</small><b>Rs. ${n(s.turnover??s.totalTradedValue)}</b></div><div class="stock-card"><small>Technical view</small><b>${signal(s)}</b></div></section><section class="stock-card chart-panel"><div class="panel-title"><div><small>PRICE ACTION</small><h2>${esc(sym)} technical chart</h2></div><span>Latest available source data</span></div><div class="chart-box"><canvas id="chart"></canvas></div></section><section class="analysis-grid"><div class="stock-card"><small>TECHNICAL DECISION</small><h2>Buy / Hold / Sell</h2><div class="decision hold">HOLD</div><p>Automated decision is intentionally conservative. A true buy/sell signal requires validated historical indicators and market context; it must not be fabricated from one LTP snapshot.</p></div><div class="stock-card"><small>ORDER FLOW</small><h2>Buyers vs sellers</h2><p>Public NEPSE data does not provide the number of individual people currently buying, selling or holding this stock. This app will show verified order/trade-side data only when the upstream source publishes it.</p></div></section>`;new Chart($('#chart'),{type:'line',data:{labels:[new Date().toLocaleDateString('ne-NP')],datasets:[{label:'LTP',data:[ltp],borderWidth:2,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:false}}}})}catch(e){$('#company').innerHTML='<section class="stock-card"><h1>Unable to load stock data</h1><p>Please try again when the upstream market source is available.</p></section>'}}boot();</script></body></html>
