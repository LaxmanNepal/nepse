<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Stock Research | NEPSE Pulse</title>
<meta id="metaDescription" name="description" content="Comprehensive NEPSE stock research, price, chart and technical analysis.">
<link rel="stylesheet" href="../../style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--n:#07111f;--g:#c79a2b;--bg:#f4f6f8;--p:#fff;--t:#101828;--m:#667085;--l:#e4e7ec;--up:#087443;--dn:#c43232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,sans-serif}.nav{position:sticky;top:0;z-index:50;background:var(--n);color:#fff;display:flex;align-items:center;gap:18px;padding:12px max(16px,calc((100% - 1280px)/2))}.brand{color:#fff;text-decoration:none;font-weight:900;white-space:nowrap}.brand i{color:var(--g);font-style:normal}.search{position:relative;flex:1;max-width:560px}.search input{width:100%;height:42px;border:1px solid #344256;border-radius:7px;background:#111d2c;color:#fff;padding:0 14px;outline:0}.search input:focus{border-color:var(--g)}.suggest{display:none;position:absolute;top:47px;left:0;right:0;background:#fff;color:var(--t);border:1px solid var(--l);border-radius:8px;box-shadow:0 18px 45px #07111f24;overflow:hidden}.suggest.open{display:block}.suggest button{width:100%;border:0;background:#fff;padding:12px 14px;display:flex;justify-content:space-between;text-align:left;cursor:pointer}.suggest button:hover{background:#f5f7fa}.suggest b{display:block}.suggest span{color:var(--g);font-weight:900}.clock{font-size:12px;color:#d0d7e2;white-space:nowrap}.wrap{max-width:1280px;margin:auto;padding:24px 16px 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding:10px 0 20px}.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--m);font-weight:900}.symbol{color:var(--g);font-weight:900;font-size:14px;margin:5px 0}.hero h1{font-size:30px;line-height:1.15;margin:0}.sector{color:var(--m);margin-top:7px}.quote{text-align:right}.quote .price{font-size:38px;font-weight:900;letter-spacing:-.04em}.quote .change{display:block;font-weight:900;margin-top:3px}.up{color:var(--up)}.down{color:var(--dn)}.session{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--n);color:#e5eaf1;padding:11px 14px;border-radius:7px;font-size:12px}.live{color:#6ee7a8}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--l);border:1px solid var(--l);margin:16px 0}.stat{background:var(--p);padding:14px}.stat small{display:block;color:var(--m);font-size:10px;text-transform:uppercase;font-weight:900}.stat strong{display:block;margin-top:6px;font-size:15px}.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,1fr);gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:18px;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.head h2{margin:2px 0;font-size:18px}.muted{color:var(--m);font-size:12px;line-height:1.6}.ranges{display:flex;gap:4px;overflow:auto}.ranges button{border:1px solid var(--l);background:#fff;border-radius:5px;padding:7px 10px;font-weight:800;cursor:pointer}.ranges button.active{background:var(--n);color:#fff;border-color:var(--n)}.chart{height:390px}.signal{font-weight:900;border-radius:5px;padding:7px 11px}.signal.buy{background:#eaf7f0;color:var(--up)}.signal.hold{background:#fff5d9;color:#8a6500}.signal.sell{background:#fceeee;color:var(--dn)}.decision{display:flex;gap:18px;align-items:center}.score{width:88px;height:88px;border:7px solid var(--g);border-radius:50%;display:grid;place-content:center;text-align:center;flex:none}.score b{font-size:24px}.score small{color:var(--m)}.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.reason{background:#f2f4f7;border-radius:4px;padding:5px 7px;font-size:11px}.indicators{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-top:1px solid var(--l);border-left:1px solid var(--l)}.indicator{padding:11px;border-right:1px solid var(--l);border-bottom:1px solid var(--l)}.indicator small{display:block;color:var(--m);font-size:10px}.indicator b{display:block;margin-top:5px}.activity{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.activity div{border:1px solid var(--l);padding:12px}.activity b{display:block;font-size:20px;margin:4px 0}.activity small{color:var(--m);font-size:10px;line-height:1.4}.list{margin:0;padding-left:18px;color:var(--m);line-height:2}.disclaimer{border-top:1px solid var(--l);margin-top:16px;padding-top:12px;color:var(--m);font-size:11px;line-height:1.5}.error{padding:50px;text-align:center;background:#fff;border:1px solid var(--l);border-radius:8px}.error a{color:var(--g);font-weight:900}@media(max-width:800px){.nav{flex-wrap:wrap}.brand{width:auto}.clock{order:3;width:100%}.search{order:2;flex-basis:calc(100% - 130px)}.wrap{padding:16px 12px 45px}.hero{display:block}.quote{text-align:left;margin-top:15px}.quote .price{font-size:32px}.hero h1{font-size:23px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.chart{height:300px}.indicators{grid-template-columns:repeat(2,1fr)}.activity{grid-template-columns:1fr}.session{font-size:11px}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="../../">NEPSE <i>RESEARCH</i></a><div class="search"><input id="search" autocomplete="off" placeholder="Search company or symbol…" aria-label="Search NEPSE company"><div id="suggest" class="suggest"></div></div><div id="clock" class="clock">Market</div></header>
<main class="wrap"><div id="app"><div class="error">Loading company research…</div></div></main>
<script src="../../technical.js"></script>
<script>
const symbol=location.pathname.split('/').filter(Boolean).at(-1).toUpperCase();const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function name(s){return s.name||s.companyName||s.company||s.securityName||symbol}function sym(s){return String(s.symbol||s.ticker||s.securitySymbol||'').toUpperCase()}function ltp(s){return Number(s.ltp??s.lastTradedPrice??s.lastPrice??0)}function ch(s){return Number(s.change??s.pointChange??s.changeAmount??0)}function pct(s){return Number(s.percent_change??s.percentChange??s.percentageChange??(ltp(s)-Number(s.previous_close??s.previousClose??ltp(s)))/Math.max(Number(s.previous_close??s.previousClose??ltp(s)),1)*100)}function nepDate(d){return new Intl.DateTimeFormat('ne-NP-u-ca-bikram-sambat',{year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:'Asia/Kathmandu'}).format(d)}function nepTime(d){return new Intl.DateTimeFormat('ne-NP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,timeZone:'Asia/Kathmandu'}).format(d)}function openNow(d=new Date()){const p=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Kathmandu'}).formatToParts(d);const w=p.find(x=>x.type==='weekday').value,h=+p.find(x=>x.type==='hour').value,m=+p.find(x=>x.type==='minute').value;return ['Mon','Tue','Wed','Thu','Fri'].includes(w)&&h>=11&&h<15}function fmt(v){return v==null||Number.isNaN(Number(v))?'—':n(v)}
let data=null,chart=null,range='1D';
function series(){return (data.history||[]).map(x=>({time:x.timestamp,ltp:ltp(x.stock||x),high:Number((x.stock||x).high||ltp(x.stock||x)),low:Number((x.stock||x).low||ltp(x.stock||x)),volume:Number((x.stock||x).volume??(x.stock||x).totalTradedQuantity??0)})).sort((a,b)=>a.time.localeCompare(b.time))}
function analysis(rows){if(rows.length<20)return {signal:'HOLD',score:null,reasons:['Insufficient intraday observations']};const vals=rows.map(x=>x.ltp),hi=rows.map(x=>x.high),lo=rows.map(x=>x.low);return window.NEPSETechnical?.analyze?NEPSETechnical.analyze(vals,hi,lo):{signal:'HOLD',score:null,reasons:['Technical engine unavailable']}}
function render(){const s=data.stock,rows=series(),t=analysis(rows),now=new Date(),up=ch(s)>=0;document.title=`${name(s)} (${symbol}) Share Price, Technical Analysis & Research | NEPSE Pulse`;$('#metaDescription').content=`${name(s)} (${symbol}) latest NEPSE share price, chart, technical analysis, market data and research.`;const prev=Number(s.previous_close??s.previousClose??ltp(s)-ch(s));$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">COMPREHENSIVE STOCK RESEARCH</div><div class="symbol">${esc(symbol)}</div><h1>${esc(name(s))}</h1><div class="sector">${esc(s.sector||s.sectorName||'NEPSE listed company')}</div></div><div class="quote"><div class="price">Rs. ${n(ltp(s))}</div><span class="change ${up?'up':'down'}">${up?'+':''}${n(ch(s))} (${pct(s).toFixed(2)}%)</span></div></section><section class="session"><span class="${openNow(now)?'live':''}">● ${openNow(now)?'Market open — collecting intraday data':'Market closed — showing latest available data'}</span><b>${nepDate(now)} · ${nepTime(now)} Nepal Time</b></section><section class="stats">${[['Previous close',prev],['Open',s.open],['High',s.high],['Low',s.low],['Volume',s.volume??s.totalTradedQuantity],['Turnover',s.turnover??s.totalTradedValue]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[0]==='Turnover'?'Rs. ':''}${fmt(x[1])}</strong></div>`).join('')}</section><section class="cols"><div><section class="card"><div class="head"><div><div class="eyebrow">PRICE ACTION</div><h2>${esc(symbol)} technical chart</h2></div><div class="ranges">${['1D','1W','1M','3M','6M','1Y','MAX'].map(r=>`<button class="${r===range?'active':''}" data-range="${r}">${r}</button>`).join('')}</div></div><div class="chart"><canvas id="chart"></canvas></div><p class="muted">${rows.length} stored intraday observations for this company. The page is regenerated by GitHub Actions from the market source.</p></section><section class="card"><div class="head"><div><div class="eyebrow">TECHNICAL DECISION</div><h2>Buy / Hold / Sell</h2></div><span class="signal ${(t.signal||'HOLD').toLowerCase()}">${esc(t.signal||'HOLD')}</span></div><div class="decision"><div class="score"><b>${t.score??'—'}</b><small>/100</small></div><div><h3>${t.signal==='BUY'?'Bullish setup':t.signal==='SELL'?'Bearish setup':'Wait for confirmation'}</h3><p class="muted">Rule-based technical assessment. It is not a guaranteed prediction.</p><div class="reasons">${(t.reasons||[]).map(r=>`<span class="reason">✓ ${esc(r)}</span>`).join('')}</div></div></div><div class="indicators">${[['RSI 14',t.rsi],['SMA 20',t.s20],['SMA 50',t.s50],['EMA 20',t.ema20],['MACD',t.macd],['ADX',t.adx],['ATR',t.atr],['BB Upper',t.bbUpper]].map(x=>`<div class="indicator"><small>${x[0]}</small><b>${fmt(x[1])}</b></div>`).join('')}</div></section></div><aside><section class="card"><div class="eyebrow">ORDER FLOW</div><h2>Buy / Sell / Hold</h2><div class="activity"><div><small>BUYERS</small><b>—</b><small>Individual buyer count is not supplied by the current source.</small></div><div><small>SELLERS</small><b>—</b><small>Individual seller count is not supplied by the current source.</small></div><div><small>HOLDERS</small><b>—</b><small>Holder count is not supplied by the current source.</small></div></div><p class="disclaimer">The app never invents participant counts. If a verified order-book/trade-side source becomes available, these fields can be populated.</p></section><section class="card"><div class="eyebrow">RESEARCH</div><h2>What to analyze</h2><ul class="list"><li>Trend and moving averages</li><li>Momentum and RSI</li><li>MACD confirmation</li><li>Volume behaviour</li><li>Support and resistance</li><li>EPS, P/E and book value</li><li>Dividend history</li><li>Corporate actions</li></ul></section></aside></section>`;draw(rows);document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()})}
function rowsForRange(rows){if(range==='1D')return rows.slice(-390);const days={1W:5,1M:22,3M:66,6M:132,1Y:260};return rows.slice(-(days[range]||rows.length))}function draw(rows){if(chart)chart.destroy();const r=rowsForRange(rows),v=r.map(x=>x.ltp);chart=new Chart($('#chart'),{type:'line',data:{labels:r.map(x=>new Date(x.time).toLocaleTimeString('ne-NP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kathmandu'})),datasets:[{label:'LTP',data:v,borderWidth:2,pointRadius:0,tension:.18},{label:'SMA 20',data:NEPSETechnical.sma(v,20),borderWidth:1,pointRadius:0,tension:.15},{label:'SMA 50',data:NEPSETechnical.sma(v,50),borderWidth:1,pointRadius:0,tension:.15}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{x:{ticks:{maxTicksLimit:8}},y:{beginAtZero:false}}}})}
async function load(){try{const r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('missing data.json');data=await r.json();render();$('#clock').textContent=openNow()?'● Market Open':'Market Closed';setInterval(()=>load(),60000);setupSearch()}catch(e){$('#app').innerHTML='<section class="error"><h2>Company data is not available yet</h2><p>GitHub Actions has not generated the data file for this stock yet.</p><a href="../../">Return to market</a></section>'}}
async function setupSearch(){const input=$('#search'),box=$('#suggest');let stocks=[];try{const r=await fetch('../../data/live.json?ts='+Date.now());const d=await r.json();stocks=d.stocks||d.data||d}catch(e){return}function paint(q){const a=stocks.filter(s=>(name(s)+' '+sym(s)).toLowerCase().includes(q.toLowerCase())).slice(0,10);box.innerHTML=a.map(s=>`<button data-symbol="${esc(sym(s))}"><b>${esc(name(s))}</b><span>${esc(sym(s))}</span></button>`).join('');box.classList.toggle('open',!!q&&a.length>0)}input.addEventListener('focus',()=>paint(input.value));input.addEventListener('input',()=>paint(input.value));box.addEventListener('click',e=>{const b=e.target.closest('[data-symbol]');if(b)location.href='../../stock/'+b.dataset.symbol.toLowerCase()+'/'});document.addEventListener('click',e=>{if(!e.target.closest('.search'))box.classList.remove('open')})}load();
</script>
</body>
</html>
