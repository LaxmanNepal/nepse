name: NEPSE data and finance news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'stock/_template/**'
      - 'news/**'
      - 'data/news-sources.json'
      - '.github/workflows/nepse-minute-data.yml'
  schedule:
    # Nepal market window: Sunday–Thursday, 11:00–15:00 NPT (UTC+5:45).
    - cron: '15-55/10 5 * * 0-4'
    - cron: '*/10 6-8 * * 0-4'
    - cron: '0-15/10 9 * * 0-4'

permissions:
  contents: write

concurrency:
  group: nepse-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and collect live market snapshot
        shell: bash
        run: |
          set -e
          python scripts/update_live_market.py
          python scripts/collect_finance_news.py
          python scripts/generate_stock_pages.py
          python scripts/validate_market_data.py
          python scripts/validate_site.py
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root=Path('.')
          live=json.loads((root/'data/live.json').read_text()) if (root/'data/live.json').exists() else {}
          news=json.loads((root/'data/news.json').read_text()) if (root/'data/news.json').exists() else []
          ipos=json.loads((root/'data/ipos.json').read_text()) if (root/'data/ipos.json').exists() else []
          stocks=live.get('stocks', live.get('data', [])) if isinstance(live,dict) else []
          npt=datetime.now(ZoneInfo('Asia/Kathmandu'))
          mins=npt.hour*60+npt.minute
          market_open=npt.weekday() in (6,0,1,2,3) and 660<=mins<900
          status={'status':'ok','market':'open' if market_open else 'closed','lastUpdate':datetime.now(timezone.utc).isoformat(),'lastUpdateNPT':npt.isoformat(),'source':live.get('source') if isinstance(live,dict) else None,'sourceUpdatedAt':live.get('sourceUpdatedAt') if isinstance(live,dict) else None,'stocks':len(stocks) if isinstance(stocks,list) else 0,'index':live.get('index') if isinstance(live,dict) else None,'news':len(news) if isinstance(news,list) else 0,'ipos':len(ipos) if isinstance(ipos,list) else 0,'message':'Validated generated market data'}
          (root/'data/status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data stock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update NEPSE market data and finance news'
          git push
