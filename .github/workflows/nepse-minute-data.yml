name: NEPSE data and finance news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'stock/_template/**'
      - 'news/**'
      - 'data/news-sources.json'
      - '.github/workflows/nepse-minute-data.yml'
  schedule:
    - cron: '*/5 5-9 * * 1-5'
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: nepse-data
  cancel-in-progress: false

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and collect
        shell: bash
        run: |
          set -e
          python scripts/collect_finance_news.py
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            python scripts/generate_stock_pages.py
            exit 0
          fi
          for i in 1 2 3 4 5; do
            H=$(TZ=Asia/Kathmandu date +%H); D=$(TZ=Asia/Kathmandu date +%u)
            if [ "$D" -le 5 ] && [ "$H" -ge 11 ] && [ "$H" -lt 15 ]; then
              python scripts/generate_stock_pages.py
            fi
            [ "$i" -lt 5 ] && sleep 60 || true
          done
      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data stock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update NEPSE market data and finance news'
          git push
