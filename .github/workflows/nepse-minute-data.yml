name: NEPSE data and finance news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'stock/_template/**'
      - 'news/**'
      - 'data/news-sources.json'
      - '.github/workflows/nepse-minute-data.yml'
  schedule:
    # Nepal market window: Sunday–Thursday, 11:00–15:00 NPT (UTC+5:45).
    - cron: '15-55/10 5 * * 0-4'
    - cron: '*/10 6-8 * * 0-4'
    - cron: '0-15/10 9 * * 0-4'

permissions:
  contents: write

concurrency:
  group: nepse-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run data-quality unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Collect and validate market snapshot
        shell: bash
        run: |
          set -e
          python scripts/update_live_market.py
          python scripts/collect_finance_news.py
          python scripts/generate_stock_pages.py
          python scripts/validate_market_data.py
          python scripts/validate_site.py

      - name: Publish health metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path('.')
          live = json.loads((root / 'data/live.json').read_text())
          news = json.loads((root / 'data/news.json').read_text()) if (root / 'data/news.json').exists() else []
          ipos = json.loads((root / 'data/ipos.json').read_text()) if (root / 'data/ipos.json').exists() else []
          stocks = live.get('stocks', []) if isinstance(live, dict) else []
          npt = datetime.now(ZoneInfo('Asia/Kathmandu'))
          mins = npt.hour * 60 + npt.minute
          market_open = npt.weekday() in (6, 0, 1, 2, 3) and 660 <= mins < 900
          now = datetime.now(timezone.utc).isoformat()
          health = {
              'schemaVersion': 1,
              'status': 'healthy',
              'generatedAt': now,
              'market': 'open' if market_open else 'closed',
              'source': live.get('source'),
              'sourceUpdatedAt': live.get('sourceUpdatedAt'),
              'stocks': len(stocks) if isinstance(stocks, list) else 0,
              'news': len(news) if isinstance(news, list) else 0,
              'ipos': len(ipos) if isinstance(ipos, list) else 0,
              'validation': 'passed'
          }
          (root / 'data/health.json').write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data stock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update NEPSE market data and finance news'
          git push
