name: NEPSE minute collector
on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are 5-minute minimum. Each run performs five 60s snapshots.
    # UTC 05:15 = 11:00 Nepal; UTC 09:10 = 14:55 Nepal.
    - cron: '15-59/5 5 * * 1-5'
    - cron: '*/5 6-8 * * 1-5'
    - cron: '*/5 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: nepse-minute-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Collect five one-minute snapshots
        shell: bash
        run: |
          set -e
          for i in 1 2 3 4 5; do
            H=$(TZ=Asia/Kathmandu date +%H)
            M=$(TZ=Asia/Kathmandu date +%M)
            D=$(TZ=Asia/Kathmandu date +%u)
            if [ "$D" -le 5 ] && { [ "$H" -ge 11 ] && [ "$H" -lt 15 ]; }; then
              python scripts/generate_stock_pages.py
            fi
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
      - name: Commit market data and generated stock routes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data stock
          if git diff --cached --quiet; then echo 'No market update'; exit 0; fi
          git commit -m "chore: update NEPSE intraday data"
          git push
