name: Backfill August 2026 NEPSE company history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_august_2026.py'
      - '.github/workflows/backfill-august-2026.yml'
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build complete August history
        run: python scripts/backfill_august_2026.py
      - name: Commit history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history/2026-08.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: backfill August 2026 company history'
          git push
