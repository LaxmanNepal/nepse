name: Data quality gate

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/live.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
