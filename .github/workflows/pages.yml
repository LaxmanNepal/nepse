name: Deploy NEPSE Terminal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Python data integrity regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/update_news.py
      - name: Validate dashboard JavaScript
        run: |
          node --check app.js
          node --check features.js
          node --check news/news.js
      - name: Validate required dashboard files
        run: |
          test -s index.html
          test -s app.css
          test -s app.js
          test -s features.js
          test -s features.css
          test -s 404.html
          test -s news/index.html
          test -s news/news.js
          test -s scripts/update_news.py
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
