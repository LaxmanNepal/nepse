<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companies | NEPSE Pulse</title><meta name="description" content="Browse Nepal listed companies with market prices, sectors and research links"><link rel="stylesheet" href="../style.css"><style>main{max-width:1200px;margin:auto;padding:28px 16px 60px}.hero{padding:18px 0}.hero h1{margin:.2rem 0}.muted{color:#667085}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{padding:11px;border:1px solid #d8dde5;border-radius:8px;background:#fff}.controls input{min-width:280px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.card{border:1px solid #e4e7ec;border-radius:10px;padding:15px;background:#fff;text-decoration:none;color:inherit}.card:hover{box-shadow:0 5px 20px #0001}.sym{font-weight:900}.name{font-size:13px;margin:6px 0 12px;min-height:36px}.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#667085}.up{color:#087443}.down{color:#c43232}</style></head><body><main><div class="hero"><div class="muted">NEPSE PULSE · COMPANY DIRECTORY</div><h1>Listed Companies</h1><p class="muted">Search companies, filter sectors and open detailed research pages.</p></div><div class="controls"><input id="q" placeholder="Search symbol or company name…"><select id="sector"><option value="">All sectors</option></select><select id="sort"><option value="symbol">Symbol</option><option value="change">Change %</option><option value="ltp">LTP</option><option value="turnover">Turnover</option></select></div><p id="count" class="muted">Loading…</p><section id="grid" class="grid"></section></main><script>(()=>{const $=x=>document.getElementById(x),fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});let rows=[];function norm(s){const l=Number(s.ltp??s.lastTradedPrice??s.lastPrice??0),c=Number(s.change??s.pointChange??0);return{...s,symbol:String(s.symbol||s.ticker||'').toUpperCase(),name:s.name||s.companyName||s.company||'',ltp:l,change:c,pct:Number(s.percent_change??s.percentChange??(l-c?c/(l-c)*100:0)),sector:s.sector||s.sectorName||'Other',turnover:Number(s.turnover??s.totalTradedValue??0)}}function render(){let a=rows.filter(s=>(!$('q').value||(`${s.symbol} ${s.name}`).toLowerCase().includes($('q').value.toLowerCase()))&&(!$('sector').value||s.sector===$('sector').value));const z=$('sort').value;a.sort((x,y)=>z==='change'?y.pct-x.pct:z==='ltp'?y.ltp-x.ltp:z==='turnover'?y.turnover-x.turnover:x.symbol.localeCompare(y.symbol));$('count').textContent=`${a.length.toLocaleString()} companies`;$('grid').innerHTML=a.map(s=>`<a class="card" href="../stock/${encodeURIComponent(s.symbol.toLowerCase())}/"><div class="sym">${s.symbol}</div><div class="name">${s.name}</div><div class="meta"><span>Rs. ${fmt(s.ltp)}</span><span class="${s.change>0?'up':s.change<0?'down':''}">${s.change>0?'+':''}${fmt(s.pct)}%</span></div><div class="meta"><span>${s.sector}</span><span>Turnover Rs. ${fmt(s.turnover,0)}</span></div></a>`).join('')||'<p class="muted">No companies found.</p>'}async function load(){const r=await fetch('../data/live.json',{cache:'no-store'}),raw=await r.json();const data=typeof raw.content==='string'?JSON.parse(raw.content):raw;rows=(Array.isArray(data)?data:data.stocks||data.data||[]).map(norm).filter(x=>x.symbol);const sectors=[...new Set(rows.map(x=>x.sector))].sort();$('sector').innerHTML='<option value="">All sectors</option>'+sectors.map(x=>`<option>${x}</option>`).join('');render()}['q','sector','sort'].forEach(x=>$(x).addEventListener(x==='q'?'input':'change',render));load().catch(()=>{$('count').textContent='Unable to load market data.'})})();</script></body></html>
