<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sectors | NEPSE Pulse</title>
<meta name="description" content="Explore NEPSE sectors, market breadth, turnover and listed companies.">
<link rel="stylesheet" href="../style.css">
<style>main{max-width:1200px;margin:auto;padding:28px 16px 64px}.hero{padding:12px 0 20px}.muted{color:#667085}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.controls input,.controls select{padding:11px 12px;border:1px solid #d8dde5;border-radius:9px;background:#fff}.controls input{flex:1;min-width:240px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{border:1px solid #e4e7ec;border-radius:12px;padding:16px;background:#fff;text-decoration:none;color:inherit}.card:hover{box-shadow:0 7px 24px #0001}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.value{font-size:24px;font-weight:900;margin:12px 0 3px}.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#667085}.up{color:#087443}.down{color:#c43232}.bar{height:7px;border-radius:9px;background:#eef1f5;overflow:hidden;margin:13px 0}.bar i{display:block;height:100%;width:0;background:currentColor}.empty{padding:20px;border:1px dashed #cfd5dd;border-radius:10px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.pill{padding:8px 11px;border:1px solid #e4e7ec;border-radius:999px;font-size:13px}</style>
</head><body><main><section class="hero"><div class="muted">NEPSE PULSE · SECTOR DASHBOARD</div><h1>Market Sectors</h1><p class="muted">Compare sector breadth, traded value, price movement and constituent companies.</p></section><div class="controls"><input id="q" placeholder="Search sector…"><select id="sort"><option value="turnover">Turnover</option><option value="breadth">Breadth</option><option value="change">Average change</option><option value="count">Companies</option><option value="name">Name</option></select></div><div id="summary" class="summary"></div><section id="grid" class="grid"></section></main><script>(()=>{const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});let sectors=[],stocks=[];const unwrap=x=>x&&typeof x.content==='string'?(()=>{try{return JSON.parse(x.content)}catch{return x}})():x;function rows(x){x=unwrap(x);if(Array.isArray(x))return x;return x?.stocks||x?.data||x?.items||[]}function stock(s){const l=Number(s.ltp??s.lastTradedPrice??s.lastPrice??0),c=Number(s.change??s.pointChange??0);return{symbol:String(s.symbol||s.ticker||'').toUpperCase(),name:s.name||s.companyName||s.company||'',ltp:l,change:c,pct:Number(s.percent_change??s.percentChange??(l-c?c/(l-c)*100:0)),sector:s.sector||s.sectorName||'Other',turnover:Number(s.turnover??s.totalTradedValue??0)}}function build(){const map=new Map();stocks.forEach(s=>{if(!s.symbol)return;const key=s.sector||'Other';if(!map.has(key))map.set(key,{name:key,count:0,turnover:0,adv:0,dec:0,flat:0,sumPct:0});const x=map.get(key);x.count++;x.turnover+=s.turnover;x.sumPct+=s.pct;x[s.change>0?'adv':s.change<0?'dec':'flat']++});sectors=[...map.values()].map(x=>({...x,avgChange:x.count?x.sumPct/x.count:0,breadth:x.count?((x.adv-x.dec)/x.count)*100:0}))}function render(){let a=sectors.filter(s=>!$('q').value||s.name.toLowerCase().includes($('q').value.toLowerCase()));const z=$('sort').value;a.sort((x,y)=>z==='breadth'?y.breadth-x.breadth:z==='change'?y.avgChange-x.avgChange:z==='count'?y.count-x.count:z==='name'?x.name.localeCompare(y.name):y.turnover-x.turnover);const total=sectors.reduce((n,s)=>n+s.turnover,0),adv=stocks.filter(s=>s.change>0).length,dec=stocks.filter(s=>s.change<0).length;$('summary').innerHTML=`<span class="pill">${sectors.length} sectors</span><span class="pill">${stocks.length.toLocaleString()} securities</span><span class="pill up">${adv} advancing</span><span class="pill down">${dec} declining</span><span class="pill">Rs. ${fmt(total)} turnover</span>`;$('grid').innerHTML=a.map(s=>{const share=total?s.turnover/total*100:0;return `<a class="card" href="../market/?sector=${encodeURIComponent(s.name)}"><div class="top"><span class="name">${s.name}</span><span class="${s.avgChange>0?'up':s.avgChange<0?'down':''}">${s.avgChange>0?'+':''}${fmt(s.avgChange)}%</span></div><div class="value">Rs. ${fmt(s.turnover)}</div><div class="meta"><span>${s.count} companies</span><span>${s.adv}↑ · ${s.dec}↓ · ${s.flat}→</span></div><div class="bar"><i style="width:${Math.min(100,share*4)}%"></i></div><div class="meta"><span>Turnover share ${fmt(share)}%</span><span>Breadth ${s.breadth>0?'+':''}${fmt(s.breadth)}%</span></div></a>`}).join('')||'<div class="empty">No sector data is available in the current snapshot.</div>'}async function load(){try{const r=await fetch('../data/live.json',{cache:'no-store'});stocks=rows(await r.json()).map(stock).filter(x=>x.symbol);build();render()}catch(e){$('grid').innerHTML='<div class="empty">Unable to load repository market data.</div>'}}$('q').addEventListener('input',render);$('sort').addEventListener('change',render);load()})();</script></body></html>
