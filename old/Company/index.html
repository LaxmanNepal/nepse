<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071827"><title>Companies | NEPSE Pulse</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../app.css"><style>.directory{max-width:1380px;margin:auto;padding:22px 16px 90px}.directory-hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:14px}.directory-hero h1{margin:4px 0;font-size:30px}.directory-hero p{margin:0;color:var(--muted);font-size:12px}.count{font-size:12px;color:var(--muted)}.toolbar{position:sticky;top:64px;z-index:30;background:var(--surface-strong);border:1px solid var(--line);padding:10px;border-radius:16px;display:flex;gap:8px;margin-bottom:12px;backdrop-filter:blur(18px)}.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);border-radius:11px;background:var(--surface-strong);color:var(--text);padding:0 11px;outline:0}.toolbar input{flex:1}.company-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.company-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px;text-decoration:none;color:inherit;transition:.15s;backdrop-filter:blur(16px)}.company-row:hover{transform:translateY(-2px);border-color:rgba(20,184,166,.4)}.avatar{width:42px;height:42px;border-radius:12px;background:rgba(7,24,39,.9);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.company-row strong{display:block;font-size:11px}.company-row small{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.quote{text-align:right}.quote b{display:block;font-size:12px}.quote span{font-size:9px;font-weight:800}.up{color:var(--up)}.down{color:var(--down)}.empty{text-align:center;padding:50px;color:var(--muted);grid-column:1/-1}.pager{display:flex;justify-content:center;gap:6px;margin-top:16px}.pager button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}.pager button.active{background:#071827;color:#fff}@media(max-width:900px){.company-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.directory{padding:12px 8px 96px}.directory-hero{display:block}.directory-hero h1{font-size:24px}.toolbar{top:58px;flex-wrap:wrap}.toolbar input{flex-basis:100%}.company-grid{grid-template-columns:1fr}.company-row{padding:10px}.quote{min-width:65px}}</style></head><body><div class="app-shell"><header class="topbar"></header><main class="directory"><section class="directory-hero"><div><div class="eyebrow">NEPSE PULSE · COMPANY DIRECTORY</div><h1>All listed companies</h1><p>Search, filter and open any generated company profile.</p></div><div id="count" class="count">Loading…</div></section><div class="toolbar"><input id="q" placeholder="Search by symbol or company name…"><select id="sector"><option value="all">All sectors</option></select><select id="sort"><option value="symbol">Symbol A–Z</option><option value="change">Change ↓</option><option value="turnover">Turnover ↓</option></select></div><section id="grid" class="company-grid"><div class="empty">Loading all companies…</div></section><div id="pager" class="pager"></div></main></div><script src="../shared-header.js"></script><script>let stocks=[],filtered=[],page=1;const per=60,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>({symbol:String(s.symbol||s.ticker||s.code||'').toUpperCase(),name:String(s.name||s.companyName||s.company||s.securityName||'').trim(),sector:String(s.sector||s.sectorName||'').trim(),ltp:Number(s.ltp??s.lastTradedPrice??s.lastPrice??0),change:Number(s.change??s.pointChange??s.changeAmount??0),pc:Number(s.percent_change??s.percentChange??s.percentageChange??0),turnover:Number(s.turnover??s.totalTradedValue??0)});async function load(){try{const r=await fetch('../data/live.json?'+Date.now(),{cache:'no-store'}),d=await r.json();stocks=(d.stocks||d.data||d).map(norm).filter(x=>x.symbol);const sectors=[...new Set(stocks.map(x=>x.sector).filter(Boolean))].sort();$('#sector').innerHTML='<option value="all">All sectors</option>'+sectors.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');render()}catch{$('#grid').innerHTML='<div class="empty">Company universe could not be loaded.</div>'}}function render(){const q=$('#q').value.trim().toLowerCase(),sec=$('#sector').value,sort=$('#sort').value;filtered=stocks.filter(x=>(!q||`${x.symbol} ${x.name}`.toLowerCase().includes(q))&&(!sec||sec==='all'||x.sector===sec));if(sort==='change')filtered.sort((a,b)=>b.pc-a.pc);else if(sort==='turnover')filtered.sort((a,b)=>b.turnover-a.turnover);else filtered.sort((a,b)=>a.symbol.localeCompare(b.symbol));const pages=Math.max(1,Math.ceil(filtered.length/per));page=Math.min(page,pages);const start=(page-1)*per;$('#count').textContent=`${filtered.length.toLocaleString()} companies`;$('grid');$('#grid').innerHTML=filtered.slice(start,start+per).map(x=>`<a class="company-row" href="../stock/${encodeURIComponent(x.symbol.toLowerCase())}/"><span class="avatar">${esc(x.symbol.slice(0,2))}</span><span><strong>${esc(x.symbol)}</strong><small>${esc(x.name||'NEPSE listed company')}</small></span><span class="quote"><b>Rs. ${x.ltp.toLocaleString('en-IN',{maximumFractionDigits:2})}</b><span class="${x.change>=0?'up':'down'}">${x.change>=0?'+':''}${x.pc.toFixed(2)}%</span></span></a>`).join('')||'<div class="empty">No matching companies.</div>';$('#pager').innerHTML=Array.from({length:Math.min(pages,9)},(_,i)=>`<button class="${i+1===page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');$('#pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;render();scrollTo({top:0,behavior:'smooth'})})}$('#q').addEventListener('input',()=>{page=1;render()});$('#sector').addEventListener('change',()=>{page=1;render()});$('#sort').addEventListener('change',()=>{page=1;render()});load();</script></body></html>
