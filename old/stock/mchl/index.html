<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Stock Research | NEPSE Pulse</title><meta id="desc" name="description" content="NEPSE company research"><link rel="stylesheet" href="../../style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>.stock-app{max-width:1280px;margin:auto;padding:24px 16px 60px}.sr-nav{position:sticky;top:0;z-index:20;background:#07111f;color:#fff;padding:12px 16px;display:flex;gap:16px;align-items:center}.sr-nav a{color:#fff;text-decoration:none;font-weight:800}.sr-search{flex:1;max-width:560px}.sr-search input{width:100%;height:40px;border:1px solid #344256;border-radius:7px;background:#111d2c;color:#fff;padding:0 13px}.sr-status{font-size:12px}.sr-hero{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:24px 0 18px}.sr-eyebrow{font-size:11px;letter-spacing:.1em;color:#667085;font-weight:900}.sr-symbol{color:#b88718;font-weight:900;margin:5px 0}.sr-hero h1{margin:0;font-size:30px}.sr-sector{color:#667085;margin-top:6px}.sr-price{text-align:right}.sr-price strong{display:block;font-size:38px}.sr-up{color:#087443}.sr-down{color:#c43232}.sr-session{background:#07111f;color:#e5eaf1;padding:11px 14px;border-radius:7px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px}.sr-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#e4e7ec;margin:16px 0}.sr-stat{background:#fff;padding:14px}.sr-stat small{display:block;color:#667085;font-size:10px;font-weight:900;text-transform:uppercase}.sr-stat b{display:block;margin-top:6px}.sr-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px}.sr-card{background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:18px;margin-bottom:16px}.sr-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.sr-head h2{font-size:18px;margin:4px 0 14px}.sr-ranges{display:flex;gap:4px;overflow:auto}.sr-ranges button{border:1px solid #e4e7ec;background:#fff;border-radius:5px;padding:7px 10px;font-weight:800}.sr-ranges button.active{background:#07111f;color:#fff}.sr-chart{height:390px}.sr-signal{padding:7px 11px;border-radius:5px;font-weight:900;background:#fff5d9;color:#8a6500}.sr-signal.buy{background:#eaf7f0;color:#087443}.sr-signal.sell{background:#fceeee;color:#c43232}.sr-decision{display:flex;gap:18px;align-items:center}.sr-score{width:82px;height:82px;border:7px solid #b88718;border-radius:50%;display:grid;place-content:center;text-align:center;flex:none}.sr-score b{font-size:23px}.sr-indicators{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px}.sr-indicator{border:1px solid #e4e7ec;padding:11px}.sr-indicator small{color:#667085;font-size:10px}.sr-indicator b{display:block;margin-top:5px}.sr-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sr-flow div{border:1px solid #e4e7ec;padding:12px}.sr-flow b{display:block;font-size:20px;margin:4px 0}.sr-muted{color:#667085;font-size:12px;line-height:1.6}.sr-loading,.sr-error{padding:50px;text-align:center;background:#fff;border:1px solid #e4e7ec;border-radius:8px}.sr-error a{color:#b88718;font-weight:800}@media(max-width:800px){.sr-nav{flex-wrap:wrap}.sr-search{order:3;flex-basis:100%;max-width:none}.sr-hero{display:block}.sr-price{text-align:left;margin-top:12px}.sr-price strong{font-size:31px}.sr-hero h1{font-size:23px}.sr-stats{grid-template-columns:repeat(2,1fr)}.sr-grid{grid-template-columns:1fr}.sr-chart{height:290px}.sr-indicators{grid-template-columns:repeat(2,1fr)}.sr-flow{grid-template-columns:1fr}}</style></head><body><header class="sr-nav"><a href="../../">← NEPSE Pulse</a><div class="sr-search"><input id="q" placeholder="Search company or symbol…" autocomplete="off"></div><span id="status" class="sr-status">Loading…</span></header><main class="stock-app"><div id="app" class="sr-loading">Loading company research…</div></main><script>const ROOT='../../';const symbol=location.pathname.split('/').filter(Boolean).pop().toUpperCase();const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});const pct=v=>`${Number(v)>=0?'+':''}${Number(v||0).toFixed(2)}%`;let data,chart,range='1D';async function get(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function sname(s){return s.name||s.companyName||s.company||s.securityName||symbol}function ltp(s){return Number(s.ltp??s.lastTradedPrice??s.lastPrice??0)}function change(s){return Number(s.change??s.pointChange??s.changeAmount??0)}function percent(s){return Number(s.percent_change??s.percentChange??s.percentageChange??0)}function rows(){return (data.history||[]).map(x=>{const s=x.stock||x;return {time:x.timestamp,ltp:ltp(s)}}).filter(x=>x.ltp>0).sort((a,b)=>a.time.localeCompare(b.time))}function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}function calc(r){const a=r.map(x=>x.ltp);if(a.length<20)return{signal:'HOLD',score:null,rsi:null,s20:null,s50:null};const s20=sma(a,20).at(-1),s50=sma(a,50).at(-1);let gains=0,loss=0;for(let i=Math.max(1,a.length-14);i<a.length;i++){const d=a[i]-a[i-1];if(d>0)gains+=d;else loss-=d}const rs=loss?gains/loss:100,rsi=100-100/(1+rs);let score=0;if(a.at(-1)>s20)score+=25;if(s50&&a.at(-1)>s50)score+=25;if(rsi>=50)score+=25;if(a.at(-1)>a[Math.max(0,a.length-2)])score+=25;return{signal:score>=75?'BUY':score<=25?'SELL':'HOLD',score,rsi,s20,s50}}function openNow(){const p=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'2-digit',hour12:false,timeZone:'Asia/Kathmandu'}).formatToParts(new Date());const h=+p.find(x=>x.type==='hour').value;return ['Mon','Tue','Wed','Thu','Fri'].includes(p.find(x=>x.type==='weekday').value)&&h>=11&&h<15}function nepDate(){return new Intl.DateTimeFormat('ne-NP-u-ca-bikram-sambat',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Kathmandu'}).format(new Date())}function render(){const s=data.stock,r=rows(),t=calc(r),up=change(s)>=0;document.title=`${sname(s)} (${symbol}) Share Price & Technical Analysis | NEPSE Pulse`;$('#desc').content=`${sname(s)} (${symbol}) latest NEPSE share price, chart and technical research.`;const prev=Number(s.previous_close??s.previousClose??ltp(s)-change(s));$('#app').innerHTML=`<section class="sr-hero"><div><div class="sr-eyebrow">COMPREHENSIVE STOCK RESEARCH</div><div class="sr-symbol">${esc(symbol)}</div><h1>${esc(sname(s))}</h1><div class="sr-sector">${esc(s.sector||s.sectorName||'NEPSE listed company')}</div></div><div class="sr-price"><strong>Rs. ${num(ltp(s))}</strong><span class="${up?'sr-up':'sr-down'}">${up?'+':''}${num(change(s))} (${pct(percent(s))})</span></div></section><section class="sr-session"><span>${openNow()?'● Market open — live window':'● Market closed — latest available data'}</span><b>${nepDate()} · Nepal Time</b></section><section class="sr-stats">${[['Previous close',prev],['Open',s.open],['High',s.high],['Low',s.low],['Volume',s.volume??s.totalTradedQuantity],['Turnover',s.turnover??s.totalTradedValue]].map(x=>`<div class="sr-stat"><small>${x[0]}</small><b>${x[0]==='Turnover'?'Rs. ':''}${num(x[1])}</b></div>`).join('')}</section><section class="sr-grid"><div><section class="sr-card"><div class="sr-head"><div><div class="sr-eyebrow">PRICE ACTION</div><h2>${esc(symbol)} chart</h2></div><div class="sr-ranges">${['1D','7D','1M','3M','6M','1Y'].map(x=>`<button class="${range===x?'active':''}" data-range="${x}">${x}</button>`).join('')}</div></div><div class="sr-chart"><canvas id="chart"></canvas></div><p class="sr-muted">${r.length} stored observations. Historical data grows automatically as the collector runs.</p></section><section class="sr-card"><div class="sr-head"><div><div class="sr-eyebrow">TECHNICAL DECISION</div><h2>Buy / Hold / Sell</h2></div><span class="sr-signal ${(t.signal||'HOLD').toLowerCase()}">${t.signal||'HOLD'}</span></div><div class="sr-decision"><div class="sr-score"><b>${t.score??'—'}</b><small>/100</small></div><div><h3>${t.signal==='BUY'?'Bullish setup':t.signal==='SELL'?'Bearish setup':'Wait for confirmation'}</h3><p class="sr-muted">Rule-based signal from price trend and momentum. Not financial advice.</p></div></div><div class="sr-indicators">${[['RSI 14',t.rsi],['SMA 20',t.s20],['SMA 50',t.s50]].map(x=>`<div class="sr-indicator"><small>${x[0]}</small><b>${x[1]==null?'—':num(x[1])}</b></div>`).join('')}</div></section></div><aside><section class="sr-card"><div class="sr-eyebrow">PARTICIPANT DATA</div><h2>Buy / Sell / Hold</h2><div class="sr-flow"><div><small>BUYERS</small><b>—</b><small>Not supplied by source</small></div><div><small>SELLERS</small><b>—</b><small>Not supplied by source</small></div><div><small>HOLDERS</small><b>—</b><small>Not supplied by source</small></div></div><p class="sr-muted">Individual participant counts are not fabricated. They will appear only when a verified source provides them.</p></section></aside></section>`;draw(r);document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()})}function filtered(r){const n={1D:390,'7D':1950,'1M':8580,'3M':25740,'6M':51480,'1Y':100000}[range]||r.length;return r.slice(-n)}function draw(r){if(chart)chart.destroy();const x=filtered(r),a=x.map(v=>v.ltp);chart=new Chart($('#chart'),{type:'line',data:{labels:x.map(v=>new Date(v.time).toLocaleTimeString('ne-NP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kathmandu'})),datasets:[{label:'LTP',data:a,borderWidth:2,pointRadius:0,tension:.18},{label:'SMA 20',data:sma(a,20),borderWidth:1,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{x:{ticks:{maxTicksLimit:8}},y:{beginAtZero:false}}}})}async function boot(){try{data=await get('data.json');if(!data.stock)throw Error('invalid company data');$('#status').textContent='Data ready';render();}catch(e){console.error(e);$('#status').textContent='Data error';$('#app').innerHTML=`<section class="sr-error"><h2>Company data unavailable</h2><p>Could not load the generated data for <b>${esc(symbol)}</b>.</p><p>GitHub Actions must regenerate this company page/data file.</p><a href="../../">← Back to NEPSE</a></section>`}}boot();</script></body></html>
