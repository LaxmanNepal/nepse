<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKJCL Share Price & Technical Analysis | NEPSE Pulse</title><link rel="stylesheet" href="../../style.css"><style>body{margin:0;background:#f5f7fa;color:#101828;font-family:Inter,system-ui,sans-serif}.bar{background:#07111f;color:#fff;padding:14px 18px;display:flex;gap:18px;align-items:center}.bar a{color:#fff;text-decoration:none;font-weight:800}.bar input{flex:1;max-width:520px;height:40px;background:#111d2c;border:1px solid #344256;border-radius:7px;color:#fff;padding:0 12px}.wrap{max-width:1200px;margin:auto;padding:25px 16px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{font-size:11px;color:#667085;font-weight:900;letter-spacing:.1em}.symbol{color:#b88718;font-weight:900}.hero h1{margin:4px 0;font-size:30px}.muted{color:#667085}.price{text-align:right}.price strong{display:block;font-size:38px}.up{color:#087443}.down{color:#c43232}.session{margin:18px 0;background:#07111f;color:#fff;padding:12px;border-radius:7px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#e4e7ec;margin:16px 0}.stat{background:#fff;padding:14px}.stat small{display:block;color:#667085}.stat b{display:block;margin-top:6px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:18px;margin-bottom:16px}.chart{height:390px;overflow:hidden}.chart svg{width:100%;height:100%}.signal{display:inline-block;padding:7px 11px;border-radius:5px;font-weight:900;background:#fff5d9;color:#8a6500}.signal.buy{background:#eaf7f0;color:#087443}.signal.sell{background:#fceeee;color:#c43232}.score{font-size:32px;font-weight:900;color:#b88718}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flow div{border:1px solid #e4e7ec;padding:12px}.flow b{display:block;font-size:20px;margin:4px 0}@media(max-width:800px){.hero{display:block}.price{text-align:left;margin-top:15px}.hero h1{font-size:23px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.chart{height:280px}.flow{grid-template-columns:1fr}}
</style></head><body><header class="bar"><a href="../../">← NEPSE Pulse</a><input placeholder="Search company or symbol…" onclick="location.href='../../company.html'"><span>AKJCL</span></header><main class="wrap"><div id="app">Loading company research…</div></main><script>const $=s=>document.querySelector(s),fmt=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});function nep(){return new Intl.DateTimeFormat('ne-NP-u-ca-bikram-sambat',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Kathmandu'}).format(new Date())}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function boot(){try{const d=await fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});const s=d.stock||{},history=(d.history||[]).map(x=>x.stock||x).filter(x=>Number(x.ltp)>0),last=Number(s.ltp||0),change=Number(s.change||0),pct=Number(s.percent_change||0),prev=Number(s.previous_close||last-change),vals=history.map(x=>Number(x.ltp));const min=Math.min(...vals,last),max=Math.max(...vals,last),points=vals.map((v,i)=>{const x=10+(i/Math.max(vals.length-1,1))*980,y=190-((v-min)/Math.max(max-min,1))*170;return `${x},${y}`}).join(' ');let score=50;if(vals.length>=20){const sma20=vals.slice(-20).reduce((a,b)=>a+b,0)/20;if(last>sma20)score+=20;if(last>vals[Math.max(0,vals.length-2)])score+=15;if(pct>0)score+=15;else score-=15}score=Math.max(0,Math.min(100,score));const signal=score>=70?'BUY':score<=35?'SELL':'HOLD';document.title=`${esc(s.name||'AKJCL')} (AKJCL) Share Price & Technical Analysis | NEPSE Pulse`;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">COMPREHENSIVE STOCK RESEARCH</div><div class="symbol">AKJCL</div><h1>${esc(s.name||'Ankhu Khola Jalvidhyut Company Ltd')}</h1><div class="muted">${esc(s.sector||'NEPSE listed company')}</div></div><div class="price"><strong>Rs. ${fmt(last)}</strong><b class="${change>=0?'up':'down'}">${change>=0?'+':''}${fmt(change)} (${pct>=0?'+':''}${fmt(pct)}%)</b></div></section><section class="session">● Market closed — latest available data <b>${nep()}</b></section><section class="stats">${[['Previous close',prev],['Open',s.open],['High',s.high],['Low',s.low],['Volume',s.volume],['Turnover',s.turnover]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[0]==='Turnover'?'Rs. ':''}${fmt(x[1])}</b></div>`).join('')}</section><section class="grid"><div><section class="card"><div class="eyebrow">PRICE ACTION</div><h2>AKJCL Technical Chart</h2><div class="chart">${vals.length>1?`<svg viewBox="0 0 1000 200" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="#b88718" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="10" y1="190" x2="990" y2="190" stroke="#e4e7ec"/></svg>`:'<p class="muted">Historical observations are not available yet.</p>'}</div><p class="muted">${history.length} stored observations. New data is added automatically by the market collector.</p></section><section class="card"><div class="eyebrow">TECHNICAL DECISION</div><h2>Buy / Hold / Sell <span class="signal ${signal.toLowerCase()}">${signal}</span></h2><div class="score">${score}/100</div><p class="muted">Rule-based signal using available price trend data. Not financial advice.</p></section></div><aside><section class="card"><div class="eyebrow">PARTICIPANT DATA</div><h2>Buy / Sell / Hold</h2><div class="flow"><div><small>BUYERS</small><b>—</b><small>Not supplied</small></div><div><small>SELLERS</small><b>—</b><small>Not supplied</small></div><div><small>HOLDERS</small><b>—</b><small>Not supplied</small></div></div><p class="muted">The source does not provide verified individual participant counts, so the app does not invent them.</p></section><section class="card"><div class="eyebrow">DATA SOURCE</div><h2>Generated company data</h2><p class="muted">Generated at ${esc(d.generatedAt||'—')}. This page is updated automatically when GitHub Actions regenerates the company dataset.</p></section></aside></section>`}catch(e){console.error(e);$('#app').innerHTML='<section class="card"><h2>Company data unavailable</h2><p class="muted">AKJCL data.json could not be loaded. The page will work automatically after the next successful GitHub Actions generation.</p><a href="../../">← Back to NEPSE</a></section>'}}boot();</script></body></html>
